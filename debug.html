<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS 诊断</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", sans-serif; padding: 16px; background: #f2f2f7; color: #1c1c1e; }
    h1 { font-size: 20px; }
    .box { border-radius: 12px; padding: 16px; margin: 10px 0; font-size: 15px; font-weight: 700; line-height: 1.6; }
    .bad  { background: #ffd7d7; color: #b00000; }
    .good { background: #d7ffd9; color: #0a7a20; }
    /* 这两块默认隐藏，只有对应的脚本真的跑了才显示出来 */
    #headmark, #extmark { display: none; }
    html[data-js="on"]  #headmark { display: block; }
    html[data-ext="on"] #extmark  { display: block; }
    button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #007aff; color: #fff; font-size: 16px; font-weight: 600; margin-top: 8px; }
    pre { background: #1c1c1e; color: #7bed7b; font-size: 12px; padding: 12px; border-radius: 10px; white-space: pre-wrap; word-break: break-all; min-height: 70px; }
  </style>
  <script>document.documentElement.setAttribute('data-js', 'on');</script>
</head>
<body>

<h1>JavaScript 可用性诊断</h1>
<p style="font-size:13px;color:#636366">看下面 5 条各是什么颜色 / 有没有出现，然后整页截图发回来。</p>

<noscript>
  <div class="box bad">
    ① noscript 显示了 —— 说明 Safari 的 JavaScript 是关闭的<br><br>
    修复：iPhone「设置」→ 往下找到「Safari 浏览器」→「高级」→ 打开「JavaScript」<br>
    然后回到本页下拉刷新
  </div>
</noscript>

<div class="box bad" id="bodymark">
  ② 这条现在是红的。脚本正常时它会变成绿色。
</div>

<div class="box good" id="headmark">③ head 里的内联脚本执行了 ✓</div>

<div class="box good" id="extmark">④ 外部文件 probe.js 加载并执行了 ✓</div>

<button onclick="document.getElementById('out').textContent = '⑤ 内联 onclick 可用 ✓';">
  点我：测试内联 onclick
</button>

<pre id="out">（点上面按钮前，这里应显示 UA）</pre>

<script src="probe.js"></script>
<script>
(function () {
  var el = document.getElementById('bodymark');
  el.className = 'box good';
  el.textContent = '② body 里的内联脚本执行了 ✓';
  document.getElementById('out').textContent = 'UA: ' + navigator.userAgent;
})();
</script>

</body>
</html>
